[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boatrace-analyst-phase1"
version = "0.1.0"
description = "Read, validate, and record BOAT RACE v1 ingestion runs"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
boatrace-phase1 = "boatrace_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
