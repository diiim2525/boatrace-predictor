
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOATRACE ANALYST</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101722;color:#eef3fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:12px 0 22px;border-bottom:1px solid #344154}
small,.muted{color:#91a4bd}
h1{font-size:25px;margin:8px 0}
h2{font-size:18px;margin:0 0 16px}
.card{background:#1b2737;border:1px solid #344154;border-radius:15px;padding:16px;margin-top:16px}
label{display:block;color:#aebed1;font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;background:#101722;color:white;border:1px solid #46566d;border-radius:9px;padding:12px;font-size:15px}
textarea{min-height:75px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:#29a879;color:white;border:0;border-radius:9px;padding:14px;font-size:15px;font-weight:bold;width:100%;margin-top:12px}
.secondary{background:#34445a}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 4px;border-bottom:1px solid #344154;text-align:left}
th{color:#9db0c8}
.result{background:#101722;border-radius:9px;padding:12px;margin-top:10px;line-height:1.8;overflow-wrap:anywhere}
.tag{color:#52d7a7}
.boat{font-weight:bold}
.error{color:#ff9d9d}
</style>
</head>
<body>

<header>
<small>BOATRACE DATA & ANALYSIS</small>
<h1>BOATRACE ANALYST</h1>
<div class="muted">予想・展開分析・成績管理</div>
</header>

<section class="card">
<h2>01 / レース選択</h2>
<div class="grid">
<div>
<label>競艇場</label>
<select id="stadium"></select>
</div>
<div>
<label>レース番号</label>
<select id="raceNo"></select>
</div>
</div>
<label>開催日</label>
<input type="date" id="raceDate">
<div id="loadStatus" class="muted" style="margin-top:10px">データ読み込み中...</div>
</section>

<section class="card">
<h2>02 / 出走データ</h2>
<div class="muted">出走表データを自動表示します</div>
<div style="overflow-x:auto;margin-top:12px">
<table>
<thead>
<tr>
<th>艇</th><th>選手名</th><th>級別</th><th>全国勝率</th><th>モーター</th><th>2連率</th>
</tr>
</thead>
<tbody id="raceTable">
<tr><td colspan="6">データを読み込んでください</td></tr>
</tbody>
</table>
</div>
<div id="raceInfo" class="result muted">レース情報</div>
</section>

<section class="card">
<h2>03 / 展開予想</h2>
<label>本命の展開</label>
<select id="mainPattern">
<option>1号艇の逃げ</option>
<option>2号艇の差し</option>
<option>3号艇のまくり</option>
<option>4号艇のまくり</option>
<option>5号艇のまくり差し</option>
<option>6号艇の展開突き</option>
<option>混戦・抜き</option>
</select>
<label>展開の根拠</label>
<textarea id="reason" placeholder="なぜこの展開になると考えたか"></textarea>
<label>警戒する展開</label>
<textarea id="caution" placeholder="本線が崩れる条件"></textarea>
</section>

<section class="card">
<h2>04 / 3連単買い目</h2>
<div class="grid">
<div>
<label>1着</label>
<input id="first" placeholder="例：3">
</div>
<div>
<label>2着</label>
<input id="second" placeholder="例：1,4">
</div>
<div>
<label>3着</label>
<input id="third" placeholder="例：1,2,4">
</div>
<div>
<label>購入金額（合計・円）</label>
<input id="amount" type="number" min="0" placeholder="1000">
</div>
</div>
<label>買い目の確認</label>
<div id="ticketResult" class="result">買い目を入力してください</div>
<button onclick="createTickets()">買い目を作成</button>
<button class="secondary" onclick="saveAnalysis()">予想を保存</button>
</section>

<section class="card">
<h2>05 / 振り返り</h2>
<label>実際の結果（3連単）</label>
<input id="actual" placeholder="例：3-1-4">
<label>結果・反省</label>
<textarea id="reflection" placeholder="予想と実際の展開を比較する"></textarea>
<button class="secondary" onclick="saveReflection()">振り返りを保存</button>
<div id="saveStatus" class="muted"></div>
</section>

<script>
const stadiumNames = {
"1":"桐生","2":"戸田","3":"江戸川","4":"平和島",
"5":"多摩川","6":"浜名湖","7":"蒲郡","8":"常滑",
"9":"津","10":"三国","11":"びわこ","12":"住之江",
"13":"尼崎","14":"鳴門","15":"丸亀","16":"児島",
"17":"宮島","18":"徳山","19":"下関","20":"若松",
"21":"芦屋","22":"福岡","23":"唐津","24":"大村"
};

let allData = null;
let currentRace = null;

const stadium = document.getElementById("stadium");
const raceNo = document.getElementById("raceNo");

function setStatus(message, error=false){
 const el=document.getElementById("loadStatus");
 el.textContent=message;
 el.className=error?"error":"muted";
}

function initStadiums(){
 stadium.innerHTML="";
 Object.entries(stadiumNames).forEach(([id,name])=>{
  const option=document.createElement("option");
  option.value=id;
  option.textContent=name;
  stadium.appendChild(option);
 });
}

async function loadData(){
 try{
  const response=await fetch("./data/today.json?time="+Date.now());
  if(!response.ok) throw new Error("JSONの取得に失敗しました");
  allData=await response.json();

  const programs=allData.programs?.stadiums || {};
  const available=Object.keys(programs);

  if(!available.length) throw new Error("開催データが見つかりません");

  [...stadium.options].forEach(option=>{
   option.disabled=!programs[option.value];
  });

  const first=available[0];
  stadium.value=first;

  const races=programs[first].races || {};
  const firstRace=Object.keys(races)[0] || "1";
  setRaceOptions();
  raceNo.value=firstRace;
  showRace();

  setStatus("データ読み込み完了");
 }catch(error){
  setStatus("読み込みエラー："+error.message,true);
 }
}

function setRaceOptions(){
 const programs=allData?.programs?.stadiums || {};
 const races=programs[stadium.value]?.races || {};
 raceNo.innerHTML="";

 Object.keys(races).sort((a,b)=>Number(a)-Number(b)).forEach(id=>{
  const option=document.createElement("option");
  option.value=id;
  option.textContent=id+"R";
  raceNo.appendChild(option);
 });
}

function showRace(){
 if(!allData)return;

 const race=allData.programs?.stadiums?.[stadium.value]?.races?.[raceNo.value];

 if(!race){
  document.getElementById("raceTable").innerHTML=
   '<tr><td colspan="6">このレースのデータはありません</td></tr>';
  currentRace=null;
  return;
 }

 currentRace=race;
 document.getElementById("raceDate").value=race.date || "";

 const boats=race.races || {};
 const tbody=document.getElementById("raceTable");
 tbody.innerHTML="";

 Object.keys(boats).sort((a,b)=>Number(a)-Number(b)).forEach(key=>{
  const b=boats[key];
  const tr=document.createElement("tr");

  const values=[
   b.entry_number ?? key,
   b.name || "不明",
   b.rank_number_source || "-",
   b.national_win_rate ?? "-",
   b.motor_number ?? "-",
   b.motor_top_2_percent ?? "-"
  ];

  values.forEach((value,index)=>{
   const td=document.createElement("td");
   td.textContent=value;
   if(index===0)td.className="boat";
   tr.appendChild(td);
  });

  tbody.appendChild(tr);
 });

 document.getElementById("raceInfo").innerHTML=
  "競艇場："+stadiumNames[stadium.value]+"<br>"+
  "レース："+raceNo.value+"R<br>"+
  "開催日："+(race.date || "-")+"<br>"+
  "グレード："+(race.grade_number_source || "-")+"<br>"+
  "距離："+(race.distance || "-")+"m<br>"+
  "開催日数："+(race.day_number || "-")+"日目";
}

function parseNumbers(id){
 return document.getElementById(id).value
  .split(",")
  .map(x=>Number(x.trim()))
  .filter(x=>Number.isInteger(x)&&x>=1&&x<=6);
}

function createTickets(){
 const first=parseNumbers("first");
 const second=parseNumbers("second");
 const third=parseNumbers("third");
 const amount=Number(document.getElementById("amount").value);

 if(!first.length||!second.length||!third.length){
  document.getElementById("ticketResult").textContent=
   "1着・2着・3着を入力してください";
  return;
 }

 const tickets=[];
 first.forEach(a=>{
  second.forEach(b=>{
   third.forEach(c=>{
    if(a!==b&&a!==c&&b!==c){
     tickets.push(a+"-"+b+"-"+c);
    }
   });
  });
 });

 const unique=[...new Set(tickets)];
 const perTicket=amount>0?Math.floor(amount/unique.length):0;

 document.getElementById("ticketResult").innerHTML=
  "買い目点数："+unique.length+"点<br>"+
  "買い目："+(unique.join(" / ") || "有効な買い目がありません")+"<br>"+
  "合計金額："+(amount>0?amount.toLocaleString()+"円":"未入力")+"<br>"+
  "1点あたり："+(perTicket>0?perTicket.toLocaleString()+"円":"未設定");
}

function collectData(){
 return {
  date:document.getElementById("raceDate").value,
  stadium:stadiumNames[stadium.value],
  stadiumNumber:stadium.value,
  raceNumber:raceNo.value,
  raceData:currentRace,
  pattern:document.getElementById("mainPattern").value,
  reason:document.getElementById("reason").value,
  caution:document.getElementById("caution").value,
  first:document.getElementById("first").value,
  second:document.getElementById("second").value,
  third:document.getElementById("third").value,
  amount:document.getElementById("amount").value
 };
}

function saveAnalysis(){
 const data=collectData();
 const history=JSON.parse(localStorage.getItem("boatAnalysis")||"[]");
 history.push({...data,savedAt:new Date().toISOString()});
 localStorage.setItem("boatAnalysis",JSON.stringify(history));
 document.getElementById("saveStatus").textContent="予想を保存しました";
}

function saveReflection(){
 const history=JSON.parse(localStorage.getItem("boatAnalysis")||"[]");
 const item=history[history.length-1];
 if(!item){
  document.getElementById("saveStatus").textContent="先に予想を保存してください";
  return;
 }
 item.actual=document.getElementById("actual").value;
 item.reflection=document.getElementById("reflection").value;
 item.reviewedAt=new Date().toISOString();
 localStorage.setItem("boatAnalysis",JSON.stringify(history));
 document.getElementById("saveStatus").textContent="振り返りを保存しました";
}

stadium.addEventListener("change",()=>{
 setRaceOptions();
 showRace();
});
raceNo.addEventListener("change",showRace);

initStadiums();
loadData();
</script>
</body>
</html>
